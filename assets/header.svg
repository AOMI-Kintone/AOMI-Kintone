<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="0.6" stop-color="#1b2636"/>
      <stop offset="1" stop-color="#334862"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#446084" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb3e0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8fb3e0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8fb3e0" stop-opacity="0"/>
    </linearGradient>
    <style>
      .serif { font-family: 'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', serif; }
      .sans  { font-family: 'Helvetica Neue', Arial, sans-serif; }
      .spin  { transform-origin: 930px 180px; animation: spin 24s linear infinite; }
      .scan  { animation: scan 4s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes scan { 0%,100% { transform: translateY(0); } 50% { transform: translateY(220px); } }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- 精密計測をイメージした照準 -->
  <g stroke="#8fb3e0" fill="none">
    <circle cx="930" cy="180" r="120" stroke-opacity="0.25"/>
    <circle cx="930" cy="180" r="80" stroke-opacity="0.4"/>
    <circle cx="930" cy="180" r="6" stroke-opacity="0.9"/>
    <path d="M930 40V150M930 210V320M790 180H900M960 180H1070" stroke-opacity="0.5"/>
    <g class="spin" stroke-opacity="0.6">
      <circle cx="930" cy="180" r="100" stroke-dasharray="2 10"/>
      <path d="M930 70v14M930 276v14M820 180h14M1026 180h14"/>
    </g>
  </g>
  <text x="1050" y="118" class="sans" font-size="13" fill="#8fb3e0" letter-spacing="1">φ0.01</text>
  <text x="1050" y="250" class="sans" font-size="13" fill="#8fb3e0" letter-spacing="1">±0.5°</text>
  <rect class="scan" x="800" y="70" width="260" height="1.5" fill="url(#scan)"/>

  <!-- テキスト -->
  <g>
    <text x="72" y="96" class="sans" font-size="15" fill="#8fb3e0" letter-spacing="6">AOMI SEISAKUSHO × kintone</text>
    <rect x="72" y="112" width="48" height="2" fill="#446084"/>
    <text x="72" y="178" class="serif" font-size="46" font-weight="700" fill="#ffffff">超精密なものづくりを、</text>
    <text x="72" y="236" class="serif" font-size="46" font-weight="700" fill="#ffffff">超精密なデジタルで。</text>
    <text x="72" y="290" class="sans" font-size="16" fill="#c0c0c0" letter-spacing="1">株式会社 青海製作所 ｜ kintone カスタマイズ・業務DX</text>
  </g>
</svg>
